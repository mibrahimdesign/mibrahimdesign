<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Career evolution">
<rect width="1200" height="390" rx="24" fill="#0d1117"/>

<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .muted{fill:#8b949e}.white{fill:#f0f6fc}.blue{fill:#58a6ff}.purple{fill:#bc8cff}.green{fill:#3fb950}.orange{fill:#d29922}
  .card{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
  .line{fill:none;stroke:#30363d;stroke-width:2}
  .flow{fill:none;stroke:#58a6ff;stroke-width:2;stroke-dasharray:8 10;animation:dash 7s linear infinite}
  .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .float{animation:float 4s ease-in-out infinite}
  .fade{animation:fade 5s ease-in-out infinite}
  @keyframes dash{to{stroke-dashoffset:-180}}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.05)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes fade{0%,100%{opacity:.45}50%{opacity:1}}
</style>

<text x="600" y="60" class="white" font-size="28" font-weight="800" text-anchor="middle">14+ YEARS OF EVOLUTION</text><path d="M100 245 H1100" class="flow"/><circle cx="100" cy="245" r="16" fill="#0d1117" stroke="#58a6ff" stroke-width="4" class="pulse"/><text x="100" y="190" class="blue" font-size="18" font-weight="800" text-anchor="middle">2009</text><text x="100" y="310" class="white" font-size="16" font-weight="700" text-anchor="middle">WEB + VISUAL</text><circle cx="300" cy="245" r="16" fill="#0d1117" stroke="#58a6ff" stroke-width="4" class="pulse"/><text x="300" y="190" class="blue" font-size="18" font-weight="800" text-anchor="middle">UX/UI</text><text x="300" y="310" class="white" font-size="16" font-weight="700" text-anchor="middle">EXPERIENCE</text><circle cx="500" cy="245" r="16" fill="#0d1117" stroke="#58a6ff" stroke-width="4" class="pulse"/><text x="500" y="190" class="blue" font-size="18" font-weight="800" text-anchor="middle">LEAD</text><text x="500" y="310" class="white" font-size="16" font-weight="700" text-anchor="middle">TEAMS</text><circle cx="700" cy="245" r="16" fill="#0d1117" stroke="#58a6ff" stroke-width="4" class="pulse"/><text x="700" y="190" class="blue" font-size="18" font-weight="800" text-anchor="middle">FRONTEND</text><text x="700" y="310" class="white" font-size="16" font-weight="700" text-anchor="middle">ENGINEERING</text><circle cx="900" cy="245" r="16" fill="#0d1117" stroke="#58a6ff" stroke-width="4" class="pulse"/><text x="900" y="190" class="blue" font-size="18" font-weight="800" text-anchor="middle">SYSTEMS</text><text x="900" y="310" class="white" font-size="16" font-weight="700" text-anchor="middle">SCALE</text><circle cx="1100" cy="245" r="16" fill="#0d1117" stroke="#58a6ff" stroke-width="4" class="pulse"/><text x="1100" y="190" class="blue" font-size="18" font-weight="800" text-anchor="middle">TODAY</text><text x="1100" y="310" class="white" font-size="16" font-weight="700" text-anchor="middle">AI + PRODUCT</text>
</svg>
