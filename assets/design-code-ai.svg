<text x="105" y="230" class="white" font-size="20" font-weight="500" text-anchor="start">UX / UI</text><text x="105" y="270" class="white" font-size="20" font-weight="500" text-anchor="start">Research &amp; Prototyping</text><text x="105" y="310" class="white" font-size="20" font-weight="500" text-anchor="start">Product Design</text><text x="105" y="350" class="white" font-size="20" font-weight="500" text-anchor="start">Figma &amp; Adobe</text><text x="105" y="390" class="white" font-size="20" font-weight="500" text-anchor="start">Human-Centered UX</text>
