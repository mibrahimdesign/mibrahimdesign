<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Professional DNA">
<rect width="1200" height="560" rx="24" fill="#0d1117"/>

<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .muted{fill:#8b949e}.white{fill:#f0f6fc}.blue{fill:#58a6ff}.purple{fill:#bc8cff}.green{fill:#3fb950}.orange{fill:#d29922}
  .card{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
  .line{fill:none;stroke:#30363d;stroke-width:2}
  .flow{fill:none;stroke:#58a6ff;stroke-width:2;stroke-dasharray:8 10;animation:dash 7s linear infinite}
  .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .float{animation:float 4s ease-in-out infinite}
  .fade{animation:fade 5s ease-in-out infinite}
  @keyframes dash{to{stroke-dashoffset:-180}}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.05)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes fade{0%,100%{opacity:.45}50%{opacity:1}}
</style>


<text x="600" y="65" class="white" font-size="30" font-weight="800" text-anchor="middle">PROFESSIONAL DNA</text>
<circle cx="600" cy="285" r="88" fill="#161b22" stroke="#bc8cff" stroke-width="2" class="pulse"/>
<text x="600" y="275" class="white" font-size="21" font-weight="800" text-anchor="middle">PRODUCT</text><text x="600" y="305" class="purple" font-size="21" font-weight="800" text-anchor="middle">THINKING</text>
<rect x="90" y="115" width="260" height="110" rx="20" class="card"/><text x="220" y="178" class="blue" font-size="23" font-weight="800" text-anchor="middle">DESIGN</text><path d="M350 170 L512 255" class="flow"/><rect x="850" y="115" width="260" height="110" rx="20" class="card"/><text x="980" y="178" class="purple" font-size="23" font-weight="800" text-anchor="middle">SYSTEMS</text><path d="M850 170 L688 255" class="flow"/><rect x="90" y="350" width="260" height="110" rx="20" class="card"/><text x="220" y="413" class="green" font-size="23" font-weight="800" text-anchor="middle">ENGINEERING</text><path d="M350 405 L512 315" class="flow"/><rect x="850" y="350" width="260" height="110" rx="20" class="card"/><text x="980" y="413" class="orange" font-size="23" font-weight="800" text-anchor="middle">AI</text><path d="M850 405 L688 315" class="flow"/>
</svg>