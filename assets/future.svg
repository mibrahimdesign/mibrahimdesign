<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Future direction">
<rect width="1200" height="430" rx="24" fill="#0d1117"/>

<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .muted{fill:#8b949e}.white{fill:#f0f6fc}.blue{fill:#58a6ff}.purple{fill:#bc8cff}.green{fill:#3fb950}.orange{fill:#d29922}
  .card{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
  .line{fill:none;stroke:#30363d;stroke-width:2}
  .flow{fill:none;stroke:#58a6ff;stroke-width:2;stroke-dasharray:8 10;animation:dash 7s linear infinite}
  .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .float{animation:float 4s ease-in-out infinite}
  .fade{animation:fade 5s ease-in-out infinite}
  @keyframes dash{to{stroke-dashoffset:-180}}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.05)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes fade{0%,100%{opacity:.45}50%{opacity:1}}
</style>

<text x="600" y="60" class="white" font-size="28" font-weight="800" text-anchor="middle">THE DIRECTION</text>
<text x="600" y="110" class="muted" font-size="18" font-weight="400" text-anchor="middle">Better products emerge when disciplines stop working in isolation.</text>
<rect x="25" y="200" width="190" height="90" rx="22" class="card"/><text x="120" y="255" class="blue" font-size="16" font-weight="800" text-anchor="middle">HUMAN THINKING</text><path d="M215 245 H265" class="flow"/><rect x="265" y="200" width="190" height="90" rx="22" class="card"/><text x="360" y="255" class="purple" font-size="16" font-weight="800" text-anchor="middle">DESIGN</text><path d="M455 245 H505" class="flow"/><rect x="505" y="200" width="190" height="90" rx="22" class="card"/><text x="600" y="255" class="orange" font-size="16" font-weight="800" text-anchor="middle">SYSTEMS</text><path d="M695 245 H745" class="flow"/><rect x="745" y="200" width="190" height="90" rx="22" class="card"/><text x="840" y="255" class="green" font-size="16" font-weight="800" text-anchor="middle">ENGINEERING</text><path d="M935 245 H985" class="flow"/><rect x="985" y="200" width="190" height="90" rx="22" class="card"/><text x="1080" y="255" class="blue" font-size="16" font-weight="800" text-anchor="middle">INTELLIGENCE</text><text x="600" y="370" class="white" font-size="32" font-weight="900" text-anchor="middle">BETTER PRODUCTS</text>
</svg>