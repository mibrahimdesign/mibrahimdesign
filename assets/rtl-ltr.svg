<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="RTL and LTR architecture">
<rect width="1200" height="490" rx="24" fill="#0d1117"/>

<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .muted{fill:#8b949e}.white{fill:#f0f6fc}.blue{fill:#58a6ff}.purple{fill:#bc8cff}.green{fill:#3fb950}.orange{fill:#d29922}
  .card{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
  .line{fill:none;stroke:#30363d;stroke-width:2}
  .flow{fill:none;stroke:#58a6ff;stroke-width:2;stroke-dasharray:8 10;animation:dash 7s linear infinite}
  .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .float{animation:float 4s ease-in-out infinite}
  .fade{animation:fade 5s ease-in-out infinite}
  @keyframes dash{to{stroke-dashoffset:-180}}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.05)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes fade{0%,100%{opacity:.45}50%{opacity:1}}
</style>

<text x="600" y="65" class="white" font-size="30" font-weight="800" text-anchor="middle">ONE SYSTEM. TWO DIRECTIONS.</text>
<rect x="80" y="140" width="410" height="280" rx="24" class="card"/><rect x="710" y="140" width="410" height="280" rx="24" class="card"/>
<text x="285" y="195" class="green" font-size="28" font-weight="800" text-anchor="middle">العربية  ←</text><text x="915" y="195" class="blue" font-size="28" font-weight="800" text-anchor="middle">→  ENGLISH</text>
<text x="285" y="250" class="white" font-size="45" font-weight="800" text-anchor="middle">RTL</text><text x="915" y="250" class="white" font-size="45" font-weight="800" text-anchor="middle">LTR</text>
<text x="285" y="310" class="muted" font-size="18" font-weight="500" text-anchor="middle">Logical properties</text><text x="285" y="345" class="muted" font-size="18" font-weight="500" text-anchor="middle">Language-aware typography</text>
<text x="915" y="310" class="muted" font-size="18" font-weight="500" text-anchor="middle">Shared components</text><text x="915" y="345" class="muted" font-size="18" font-weight="500" text-anchor="middle">Shared design tokens</text>
<path d="M490 280 H710" class="flow"/><circle cx="600" cy="280" r="50" fill="#161b22" stroke="#bc8cff" stroke-width="2" class="pulse"/><text x="600" y="275" class="white" font-size="18" font-weight="800" text-anchor="middle">ONE</text><text x="600" y="300" class="purple" font-size="18" font-weight="800" text-anchor="middle">SYSTEM</text>

</svg>